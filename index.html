<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <title>Pang</title>
    <style>
      /* Inline so the loader paints before any JavaScript is downloaded. */
      html, body { margin: 0; height: 100%; background: #0b1020; }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(#0b1d3a, #1b4b7a);
        color: #fff;
        font-family: system-ui, sans-serif;
        transition: opacity 0.45s ease;
      }
      #loader.hide { opacity: 0; pointer-events: none; }
      #loader h1 {
        margin: 0;
        font-size: clamp(48px, 12vmin, 96px);
        color: #ffe28a;
        -webkit-text-stroke: 6px #7a1b2a;
        paint-order: stroke fill;
        letter-spacing: 2px;
      }
      #loader .stage { position: relative; width: 120px; height: 90px; }
      #loader .bubble {
        position: absolute;
        left: 50%;
        bottom: 6px;
        width: 44px;
        height: 44px;
        margin-left: -22px;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #fff 0 8%, #7fdcff 22%, #4cc9f0 55%, #1b6e91 100%);
        box-shadow: 0 0 18px rgba(76, 201, 240, 0.6);
        animation: bounce 0.9s cubic-bezier(0.3, 0.6, 0.5, 1) infinite alternate;
      }
      #loader .floor {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        border-radius: 2px;
        background: #3b4468;
      }
      #loader .bar {
        width: min(260px, 60vw);
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #loader .bar i {
        display: block;
        height: 100%;
        width: 8%;
        background: #4cc9f0;
        transition: width 0.2s ease;
      }
      #loader p { margin: 0; font-size: 14px; letter-spacing: 1px; color: #cfd8ff; }
      @keyframes bounce {
        from { transform: translateY(0) scale(1.08, 0.92); }
        to { transform: translateY(-40px) scale(1, 1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #loader .bubble { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <h1>PANG!</h1>
      <div class="stage"><div class="bubble"></div><div class="floor"></div></div>
      <div class="bar"><i id="loader-bar"></i></div>
      <p>Loading…</p>
    </div>
    <div id="app">
      <div id="touch">
        <div class="pad">
          <button id="btn-left" aria-label="Move left">◀</button>
          <button id="btn-right" aria-label="Move right">▶</button>
        </div>
        <button id="btn-fire" aria-label="Fire">FIRE</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
